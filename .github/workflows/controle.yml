name: Tokito Bot — controle

on:
  pull_request:
    paths:
      - 'DADOS_TOKITO/sistemas/controle.js'
      - 'DADOS_TOKITO/connect.js'
      - 'tokito.js'
      - 'DADOS_TOKITO/plugins/downloads/playcall.js'
      - 'DADOS_TOKITO/mensagens/menus.js'
      - 'DADOS_TOKITO/plugins/dono/callstatus.js'
      - 'package.json'
      - '.github/workflows/controle.yml'
  push:
    branches: [main]
    paths:
      - 'DADOS_TOKITO/sistemas/controle.js'
      - 'DADOS_TOKITO/connect.js'
      - 'tokito.js'
      - 'DADOS_TOKITO/plugins/downloads/playcall.js'
      - 'DADOS_TOKITO/mensagens/menus.js'
      - 'DADOS_TOKITO/plugins/dono/callstatus.js'
      - 'package.json'
      - '.github/workflows/controle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          node --check tokito.js
          node --check DADOS_TOKITO/connect.js
          node --check DADOS_TOKITO/plugins/downloads/playcall.js
          node --check DADOS_TOKITO/mensagens/menus.js
          node -e "const a=require('node:assert/strict');const d=require('./DADOS_TOKITO/database/lib/comandos');d.abrir('playcall');require('./DADOS_TOKITO/plugins/downloads/playcall.js');const c=d.fechar('playcall');a.equal(c?.nome,'playcall');a.deepEqual(c?.comandos,['playcall']);const fs=require('node:fs');const menu=fs.readFileSync('DADOS_TOKITO/mensagens/menus.js','utf8');a.ok(menu.includes('\u0024{prefix}playcall @pessoa música/link'))"
          node --check DADOS_TOKITO/plugins/dono/callstatus.js
          node --check DADOS_TOKITO/sistemas/controle.js
