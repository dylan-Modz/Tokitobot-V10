name: Tokito Bot — controle

on:
  pull_request:
    paths:
      - 'DADOS_TOKITO/sistemas/controle.js'
      - 'DADOS_TOKITO/connect.js'
      - 'DADOS_TOKITO/mensagens/menus.js'
      - 'tokito.js'
      - 'DADOS_TOKITO/plugins/downloads/playcall.js'
      - 'DADOS_TOKITO/plugins/dono/callstatus.js'
      - 'package.json'
      - '.github/workflows/controle.yml'
  push:
    branches: [main]
    paths:
      - 'DADOS_TOKITO/sistemas/controle.js'
      - 'DADOS_TOKITO/connect.js'
      - 'DADOS_TOKITO/mensagens/menus.js'
      - 'tokito.js'
      - 'DADOS_TOKITO/plugins/downloads/playcall.js'
      - 'DADOS_TOKITO/plugins/dono/callstatus.js'
      - 'package.json'
      - '.github/workflows/controle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm ls @stone-wpp/ofc --depth=0
      - run: npm test
      - run: node -e "const d=require('./DADOS_TOKITO/database/lib/comandos');d.abrir('playcall');require('./DADOS_TOKITO/plugins/downloads/playcall.js');const x=d.fechar('playcall');if(x?.nome!=='playcall'||!x?.comandos?.includes('playcall'))process.exit(1);console.log('PlayCall registrado:',x.nome)"

